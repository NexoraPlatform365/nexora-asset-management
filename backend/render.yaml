services:
  - type: web
    name: nexora-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /api/health
    envVars:
      - key: APP_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_PATH
        value: /var/data/nexora.db
